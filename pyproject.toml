[project]
name = "search-intel"
version = "0.1.0"
description = "Agentic Search Intelligence System - LangGraph DAG of single-responsibility agents with an AI gateway, DataForSEO tools, and a FastAPI API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.35",
    "langgraph>=0.4",
    "litellm>=1.50",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's `Depends()` in parameter defaults is the idiomatic DI style

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
